[project]
name = "david-pontient-rl-summative"
version = "0.1.0"
description = "Reinforcement learning for a home construction budget in Kigali, Rwanda"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
    "pygame>=2.5",
    "torch>=2.11",
    "torchrl==0.15.0",
    "tensordict==0.15.6",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]
